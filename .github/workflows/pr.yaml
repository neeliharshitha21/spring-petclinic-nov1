name: pull request-1
on:
  pull_request:
    branches:
       - dev 
jobs:
   build:
     runs-on: ubuntu-latest 
     steps:
       - name: get the code
         uses: actions/checkout@v6
       - name: compile phase 
         run: mvn compile
       - name: test phase 
         run: mvn test 
       - name: package phase 
         run: mvn package 